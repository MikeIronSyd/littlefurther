<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LittleFurther · Proposed OpenAI assistance references</title>
  <style>
    :root { color-scheme:light; font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif; --page:#fbfcfd; --surface:#fff; --sidebar:#f6f8fa; --ink:#14263d; --heading:#111820; --muted:#4e6178; --line:#d9e1e9; --control-line:#7a8a9f; --amber:#f2b52d; --amber-band:#fff2d0; --amber-ink:#392a0c; --focus:#175dab; --brand:#14263d; --error:#a02024; --error-bg:#fff0f0; }
    :root[data-theme="dark"] { color-scheme:dark; --page:#0e1922; --surface:#15232e; --sidebar:#12212c; --ink:#e2eaf4; --heading:#f5f7fa; --muted:#b4c5d8; --line:#344859; --control-line:#8298af; --amber-band:#342c18; --amber-ink:#fff0c6; --focus:#91c5ff; --brand:#f2b52d; --error:#ffb5b7; --error-bg:#391e26; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font-size:1rem; line-height:1.5; }
    h1,h2,h3,p { margin:0; } h1,h2,h3 { color:var(--heading); line-height:1.2; overflow-wrap:anywhere; }
    h1 { font-size:1.95rem; font-weight:750; letter-spacing:-.025em; } h2 { font-size:1.35rem; font-weight:650; letter-spacing:-.02em; } h3 { font-size:1.1rem; font-weight:650; }
    button,input,select,textarea,summary { font:inherit; color:inherit; touch-action:manipulation; }
    button,summary { cursor:pointer; } button:disabled { opacity:.55; cursor:not-allowed; }
    :focus-visible,.focus-sample { outline:3px solid var(--focus); outline-offset:3px; }
    ::selection { background:var(--amber); color:#17150f; } input,textarea { caret-color:var(--ink); }
    a { color:inherit; text-decoration:underline; text-underline-offset:.2em; overflow-wrap:anywhere; }
    .icon { width:24px; height:24px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .app-header { min-height:72px; display:flex; justify-content:space-between; align-items:center; gap:1rem; background:var(--surface); border-bottom:1px solid var(--line); }
    .brand-group { display:flex; align-items:center; min-width:0; } .brand { display:flex; align-items:center; gap:16px; padding:16px 22px; min-width:0; font-size:1.35rem; font-weight:650; }
    .brand-name { min-width:0; line-height:1.1; } .brand-mark { display:block; width:32px; height:32px; color:var(--brand); flex:0 0 auto; }
    .nav-trigger { display:grid; place-items:center; width:44px; height:44px; flex:0 0 44px; margin:14px; padding:6px; border:0; border-radius:6px; background:transparent; } .nav-trigger .icon { width:29px; height:29px; stroke-width:2; }
    .utilities { display:flex; flex-wrap:wrap; align-items:center; gap:20px; padding-right:24px; min-width:0; }
    .language-select { width:auto; max-width:100%; min-width:44px; min-height:44px; padding:10px 12px; }
    .theme-button { display:grid; place-items:center; width:44px; min-height:44px; padding:8px; }
    .account-button { display:flex; align-items:center; gap:9px; min-width:44px; min-height:44px; padding:4px 8px; }
    .account-chevron { width:18px; height:18px; } .avatar { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; font-weight:600; }
    .button { min-width:44px; min-height:44px; padding:10px 18px; border-radius:6px; font-weight:600; text-align:center; overflow-wrap:anywhere; }
    .secondary,.language-select,.theme-button,.account-button,summary { border:1px solid transparent; border-radius:6px; background:var(--sidebar); transition:border-color 150ms ease-out; }
    .secondary:not(:disabled):is(:focus-visible,:active),.language-select:is(:focus-visible,:active),.theme-button:is(:focus-visible,:active),.account-button:is(:focus-visible,:active),summary:is(:focus-visible,:active) { border-color:var(--brand); transition:none; }
    .nav-trigger:active { background:var(--sidebar); }
    @media (hover:hover) and (pointer:fine) { .secondary:hover:not(:disabled),.language-select:hover,.theme-button:hover,.account-button:hover,summary:hover { border-color:var(--brand); } .nav-trigger:hover { background:var(--sidebar); } }
    .primary { border:1px solid #a36c00; background:var(--amber); color:#17150f; }
    .app-frame { display:grid; grid-template-columns:72px minmax(0,1fr); } .sidebar { padding:24px 8px; border-right:1px solid var(--line); background:var(--sidebar); }
    .nav-links { display:flex; flex-direction:column; gap:6px; } .nav-link { min-height:52px; display:grid; place-items:center; padding:12px 10px; border-radius:8px; color:inherit; } .nav-link[aria-current="page"] { background:var(--amber-band); color:var(--amber-ink); }
    main { min-width:0; width:100%; max-width:1180px; padding:32px 36px 40px; margin-inline:auto; }
    .provenance { margin:0 0 26px; padding-bottom:14px; border-bottom:1px solid var(--line); color:var(--muted); font-size:.875rem; }
    .intro { margin:10px 0 28px; color:var(--muted); max-width:72ch; }
    .columns { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:36px; align-items:start; }
    .stack { display:flex; flex-direction:column; gap:18px; min-width:0; } .field { display:flex; flex-direction:column; gap:8px; min-width:0; }
    label { font-weight:600; } input,textarea { width:100%; min-width:0; min-height:48px; padding:10px 12px; border:1px solid var(--control-line); border-radius:6px; background:var(--surface); resize:vertical; }
    textarea { min-height:104px; } .hint,.meta { font-size:.875rem; color:var(--muted); } .meta { display:block; margin-top:4px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; } .actions > * { max-width:100%; }
    .assist { margin-top:24px; padding:20px; background:var(--amber-band); color:var(--amber-ink); border-radius:12px; }
    .assist h2,.assist h3,.assist p,.assist .hint { color:inherit; } .assist > * + * { margin-top:14px; }
    .assist .secondary { background:var(--surface); color:var(--ink); } .assist label { color:inherit; }
    .assist textarea { background:var(--surface); color:var(--ink); }
    .section { margin-top:36px; padding-top:28px; border-top:1px solid var(--line); } .section > * + * { margin-top:14px; }
    .source-list,.step-list { padding:0; margin:16px 0; list-style:none; } .source-list li,.step-list li { padding:14px 0; border-bottom:1px solid var(--line); }
    .step-list { counter-reset:step; } .step-list li { display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; counter-increment:step; }
    .step-list li::before { content:counter(step); color:var(--muted); font-variant-numeric:tabular-nums; }
    .source-title { font-weight:600; } .source-url { font-size:.875rem; color:var(--muted); overflow-wrap:anywhere; }
    .state-group { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .state { padding:18px; background:var(--sidebar); border-radius:10px; } .state > * + * { margin-top:12px; }
    .error { background:var(--error-bg); color:var(--error); } .error h3 { color:inherit; }
    .note { color:var(--muted); font-size:.875rem; margin-top:22px; max-width:75ch; }
    .stats { display:flex; flex-wrap:wrap; gap:28px; padding:20px 0; } .stats p { font-size:1rem; } .stats strong { display:block; font-size:1.4rem; font-weight:650; font-variant-numeric:tabular-nums; }
    .quote { padding:16px 0; margin:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .check-label { display:flex; align-items:flex-start; gap:10px; min-height:44px; padding:10px 0; font-weight:400; } .check-label input { width:22px; min-height:22px; height:22px; flex:0 0 22px; margin:1px 0 0; }
    summary { min-height:44px; padding:10px 12px; font-weight:600; }
    @media(max-width:799px) { .app-header { flex-wrap:wrap; gap:0; } .brand-group { width:100%; } .brand { padding:12px 16px; font-size:1.2rem; gap:12px; } .brand-mark { width:29px; height:29px; } .nav-trigger { margin:10px; } .utilities { width:100%; justify-content:flex-end; padding:0 12px 12px; gap:14px; } .account-name { display:none; } .app-frame { grid-template-columns:minmax(0,1fr); } .sidebar { display:none; } main { padding:24px 12px 32px; } h1 { font-size:1.65rem; } h2 { font-size:1.25rem; } .columns,.state-group { grid-template-columns:minmax(0,1fr); gap:28px; } .assist { padding:16px; } .actions { align-items:stretch; } .actions .button { flex:1 1 auto; } .provenance { margin-bottom:22px; } }
    @media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
    @media(forced-colors:active) { .secondary,.language-select,.theme-button,.account-button,summary { border-color:ButtonText; } .nav-trigger { border:0; } :focus-visible { outline-color:Highlight; } }
  </style>
</head>
<body>
  <div id="reference"></div>
  <script>
    const parameters = new URLSearchParams(location.search);
    const french = parameters.get('locale') === 'fr';
    const dark = parameters.get('theme') === 'dark';
    const view = parameters.get('view') || 'plan';
    document.documentElement.lang = french ? 'fr' : 'en';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const tr = (en,fr) => french ? fr : en;
    const paths = { panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18m5-13 4 4-4 4"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>', moon:'<path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/>', chevron:'<path d="m6 9 6 6 6-6"/>', home:'<path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/>', path:'<path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/>', activity:'<path d="M5 20v-6m7 6V9m7 11V4"/>' };
    const icon = kind => '<svg class="icon '+(kind==='chevron'?'account-chevron':'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+paths[kind]+'</svg>';
    const button = (en,fr,kind='secondary',extra='') => '<button type="button" class="button '+kind+'" '+extra+'>'+tr(en,fr)+'</button>';
    const header = '<header class="app-header"><div class="brand-group"><button class="nav-trigger" type="button" aria-label="'+tr('Expand navigation','Ouvrir la navigation')+'">'+icon('panel')+'</button><div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7V25H17V7H27M17 15H25"/></svg><span class="brand-name">Little<wbr>Further</span></div></div><div class="utilities"><select class="language-select" aria-label="'+tr('Language','Langue')+'"><option>'+tr('English','Français')+'</option></select><button class="theme-button" type="button" aria-label="'+(dark?tr('Switch to light mode','Passer au mode clair'):tr('Switch to dark mode','Passer au mode sombre'))+'">'+icon(dark?'sun':'moon')+'</button><button class="account-button" type="button" aria-label="'+tr('Account','Compte')+'"><span class="avatar" aria-hidden="true">R</span><span class="account-name">Reign</span>'+icon('chevron')+'</button></div></header>';
    const nav = '<aside class="sidebar"><nav class="nav-links">'+[['home','My learning','Mon apprentissage'],['path','Journeys','Parcours'],['activity','Activity','Activité']].map(([kind,en,fr],i)=>'<a href="#" class="nav-link" aria-label="'+tr(en,fr)+'" '+(i===0?'aria-current="page"':'')+'>'+icon(kind)+'</a>').join('')+'</nav></aside>';
    const provenance = '<p class="provenance">'+tr('Proposed OpenAI reference · Synthetic suggestions, sources and counts · Not the running app','Référence OpenAI proposée · Suggestions, sources et chiffres fictifs · Hors application')+'</p>';
    const footer = '<p class="note">'+tr('OpenAI help is optional and needs internet. Your saved learning records remain available while the local server runs. These editable examples are synthetic: no live inference or search produced these suggestions or citations. Future interface approval remains separate.','L’aide d’OpenAI est facultative et nécessite Internet. Vos données enregistrées restent accessibles si le serveur local fonctionne. Ces exemples sont fictifs : aucune génération ni recherche réelle n’a produit ces suggestions ou citations. L’approbation de la future interface reste distincte.')+'</p>';
    const stateSamples = '<section class="section"><h2>'+tr('Related request states','États de la demande')+'</h2><p class="hint">'+tr('Illustrative alternatives to the successful result above.','Exemples alternatifs au résultat réussi ci-dessus.')+'</p><div class="state-group"><section class="state" aria-busy="true"><h3>'+tr('Preparing a suggestion…','Préparation d’une suggestion…')+'</h3><p role="status">'+tr('Your work is unchanged. You can cancel and keep studying.','Votre travail reste intact. Vous pouvez annuler et poursuivre.')+'</p><div class="actions">'+button('Preparing…','Préparation…','secondary','disabled')+button('Cancel request','Annuler la demande')+'</div></section><section class="state error"><h3>'+tr('AI help is unavailable right now','L’aide de l’IA est indisponible')+'</h3><p role="alert">'+tr('The request could not finish. Your draft is still here. Try again later or continue on your own.','La demande n’a pas abouti. Votre brouillon est conservé. Réessayez plus tard ou continuez sans aide.')+'</p><div class="actions">'+button('Try again','Réessayer')+button('Continue on my own','Continuer sans aide')+'</div></section></div></section>';
    const mdnUrl = 'https://developer.mozilla.org/'+(french?'fr':'en-US')+'/docs/Learn_web_development/Getting_started/Your_first_website/Creating_the_content';
    const citation = '<a href="'+mdnUrl+'" class="meta">'+tr('Source example: MDN · HTML: Creating the content','Exemple de source : MDN · HTML : Créer le contenu')+'</a>';
    const plan = '<h1>'+tr('Create a learning plan','Créer un programme d’apprentissage')+'</h1><p class="intro">'+tr('Start with what you want to learn. Review every suggestion before adding it to your plan.','Partez de ce que vous souhaitez apprendre. Vérifiez chaque suggestion avant de l’ajouter.')+'</p><div class="columns"><div><div class="stack"><div class="field"><label for="goal">'+tr('Learning goal','Objectif d’apprentissage')+'</label><input id="goal" value="'+tr('Build a simple web page','Créer une page web simple')+'" readonly></div><div class="field"><label for="starting">'+tr('What do you already know?','Que savez-vous déjà ?')+'</label><textarea id="starting" readonly>'+tr('I can use a browser and a text editor. I am new to HTML.','Je sais utiliser un navigateur et un éditeur de texte. Je débute en HTML.')+'</textarea></div><div class="field"><label for="resources">'+tr('Links or excerpts you want to use (optional)','Liens ou extraits à utiliser (facultatif)')+'</label><textarea id="resources" aria-describedby="links-hint" readonly>https://developer.mozilla.org/en-US/docs/Learn_web_development</textarea><p id="links-hint" class="hint">'+tr('Supplied links start unverified. OpenAI search may consult public pages; paste an excerpt to ask about specific content.','Les liens fournis sont d’abord non vérifiés. La recherche OpenAI peut consulter des pages publiques ; collez un extrait pour étudier un contenu précis.')+'</p></div><div class="actions">'+button('Suggest a plan with AI','Proposer un programme avec l’IA')+button('Build my own plan','Créer mon propre programme')+'</div><p class="hint">'+tr('This request sends your goal, starting point and supplied text to OpenAI. Resource search may consult public pages. No saved reflection or peer content is included.','Cette demande envoie votre objectif, votre point de départ et le texte fourni à OpenAI. La recherche de ressources peut consulter des pages publiques. Aucune réflexion enregistrée ni donnée d’un pair n’est incluse.')+'</p></div><section class="section"><h2>'+tr('Suggested resources','Ressources suggérées')+'</h2><p class="hint">'+tr('Illustrative OpenAI search results · Check access and relevance','Résultats de recherche OpenAI fictifs · Vérifiez l’accès et la pertinence')+'</p><ul class="source-list"><li><a class="source-title" href="#">MDN · '+tr('Your first website','Votre premier site web')+'</a><p class="source-url">developer.mozilla.org</p><span class="meta">'+tr('Example cited source · Consultation does not guarantee accuracy or free access','Exemple de source citée · La consultation ne garantit ni exactitude ni accès gratuit')+'</span></li><li><a class="source-title" href="#">MDN · '+tr('HTML basics','Les bases du HTML')+'</a><p class="source-url">developer.mozilla.org</p><span class="meta">'+tr('Example cited source · Consultation does not guarantee accuracy or free access','Exemple de source citée · La consultation ne garantit ni exactitude ni accès gratuit')+'</span></li></ul></section></div><div><section class="assist"><h2>'+tr('Review your suggested steps','Vérifiez les étapes suggérées')+'</h2><p>'+tr('An AI draft you can edit. Dates and availability are still yours to choose.','Un brouillon proposé par l’IA, à modifier. Vous choisissez les dates et vos disponibilités.')+'</p><ol class="step-list"><li><div><strong>'+tr('Explore a small HTML page','Explorer une petite page HTML')+'</strong><span class="meta">'+tr('Read an example and identify its heading and paragraph.','Lisez un exemple et repérez son titre et son paragraphe.')+'</span>'+citation+'</div></li><li><div><strong>'+tr('Write your first page','Écrire votre première page')+'</strong><span class="meta">'+tr('Create a heading and a paragraph in your own words.','Créez un titre et un paragraphe avec vos propres mots.')+'</span>'+citation+'</div></li><li><div><strong>'+tr('Open, review and improve','Ouvrir, relire et améliorer')+'</strong><span class="meta">'+tr('Open the file in your browser and make one change.','Ouvrez le fichier dans le navigateur et apportez une modification.')+'</span>'+citation+'</div></li></ol><p class="hint">'+tr('Nothing is saved yet. Suggestions are not an assessment of your level.','Rien n’est encore enregistré. Ces suggestions n’évaluent pas votre niveau.')+'</p><div class="actions">'+button('Use this editable draft','Utiliser ce brouillon modifiable','primary')+button('Discard suggestion','Ignorer la suggestion')+'</div></section><section class="section"><h2>'+tr('Your usual review comes next','Votre vérification habituelle suit')+'</h2><p>'+tr('Edit steps, choose available dates and review the schedule before saving. Selecting this draft does not create a saved plan.','Modifiez les étapes, choisissez les dates disponibles et vérifiez le calendrier avant d’enregistrer. Ce brouillon ne crée pas encore de programme enregistré.')+'</p></section></div></div>'+stateSamples;
    const study = '<h1>'+tr('Write your first page','Écrire votre première page')+'</h1><p class="intro">'+tr('Your current step · Build a simple web page · Original estimate: 25 minutes','Votre étape actuelle · Créer une page web simple · Estimation initiale : 25 minutes')+'</p><div class="columns"><div><h2>'+tr('Make a start that fits today','Commencez à votre rythme aujourd’hui')+'</h2><p class="intro">'+tr('Create a heading and a paragraph in your own words. You can record a little study without completing the whole step.','Créez un titre et un paragraphe avec vos propres mots. Vous pouvez enregistrer un peu de travail sans terminer toute l’étape.')+'</p><div class="actions">'+button('Help me with this step','M’aider avec cette étape')+button('Suggest a 5-minute start','Proposer un début de 5 minutes')+'</div><section class="assist"><h2>'+tr('A small action to try','Une petite action à essayer')+'</h2><p>'+tr('Open your HTML file and write one heading about something you enjoy. Save it and open it in your browser.','Ouvrez votre fichier HTML et écrivez un titre sur un sujet que vous aimez. Enregistrez-le et ouvrez-le dans le navigateur.')+'</p><p class="hint">'+tr('AI suggestion · The original step and its estimate stay intact. This does not complete the step.','Suggestion de l’IA · L’étape et son estimation initiales sont conservées. Cela ne termine pas l’étape.')+'</p><div class="actions">'+button('Use this small action','Utiliser cette petite action','primary')+button('Dismiss','Ignorer')+'</div></section><section class="section"><h2>'+tr('Record your study','Enregistrer votre travail')+'</h2><div class="field"><label for="minutes">'+tr('Minutes studied','Minutes étudiées')+'</label><input id="minutes" value="5" readonly></div><div class="actions">'+button('Save study','Enregistrer le travail','primary')+button('Complete the whole step','Terminer toute l’étape')+'</div><p class="hint">'+tr('Study time and step completion remain separate actions.','Le temps d’étude et la fin d’une étape restent deux actions distinctes.')+'</p></section></div><div><h2>'+tr('A private reflection, if you want','Une réflexion privée, si vous le souhaitez')+'</h2><div class="field" style="margin-top:14px"><label for="reflection">'+tr('What would you like to remember?','Que souhaitez-vous retenir ?')+'</label><textarea id="reflection" readonly>'+tr('I started the file but I am not sure how to organise the next part.','J’ai commencé le fichier, mais je ne sais pas comment organiser la suite.')+'</textarea></div><label class="check-label"><input type="checkbox"><span>'+tr('Include this draft with the goal, current step and plan reference links sent to OpenAI for study help.','Inclure ce brouillon avec l’objectif, l’étape actuelle et les liens du programme envoyés à OpenAI pour vous aider à étudier.')+'</span></label><div class="actions">'+button('Help me reflect','M’aider à faire le point')+'</div><p class="hint">'+tr('Optional. No web search is used for reflection help. Earlier saved private reflections and peer content are excluded.','Facultatif. Aucune recherche web pour cette aide. Les réflexions privées enregistrées et les données des pairs sont exclues.')+'</p><section class="assist"><h3>'+tr('Example after you choose to send this draft','Exemple après votre accord pour envoyer ce brouillon')+'</h3><p>'+tr('You created a starting point. You could add one paragraph beneath your heading next time. Keep or change this wording.','Vous avez créé un point de départ. La prochaine fois, vous pourriez ajouter un paragraphe sous votre titre. Gardez ou modifiez cette formulation.')+'</p><div class="actions">'+button('Use this reflection draft','Utiliser ce brouillon')+button('Keep my wording','Garder mon texte')+'</div></section></div></div><section class="section"><h2>'+tr('Coming back after a break?','Vous reprenez après une pause ?')+'</h2><p>'+tr('Ask for a manageable restart suggestion. Your completed work and saved history stay intact.','Demandez une suggestion de reprise adaptée. Votre travail terminé et votre historique sont conservés.')+'</p><div class="actions">'+button('Help me restart','M’aider à reprendre')+'</div><section class="assist"><h3>'+tr('Begin with a short review','Commencez par une courte révision')+'</h3><p>'+tr('Open your last saved page, read what you wrote and choose one small edit. You can decide on new dates separately.','Ouvrez votre dernière page, relisez votre texte et choisissez une petite modification. Vous pourrez choisir de nouvelles dates séparément.')+'</p><div class="actions">'+button('Use this restart idea','Utiliser cette idée')+button('Review revised dates','Vérifier les nouvelles dates')+'</div><p class="hint">'+tr('AI does not change your schedule. The existing date preview and confirmation remain required.','L’IA ne modifie pas le calendrier. La prévisualisation et la confirmation des dates restent nécessaires.')+'</p></section></section>'+stateSamples;
    const progress = '<h1>'+tr('Your effort, kept in view','Vos efforts restent visibles')+'</h1><p class="intro">'+tr('Build a simple web page · Synthetic learning record','Créer une page web simple · Données d’apprentissage fictives')+'</p><div class="columns"><div><h2>'+tr('Progress in this plan','Progrès dans ce programme')+'</h2><div class="stats"><p><strong>1 / 3</strong>'+tr('steps marked complete','étapes marquées terminées')+'</p><p><strong>20</strong>'+tr('minutes recorded','minutes enregistrées')+'</p><p><strong>2</strong>'+tr('study days in the last 7 days','jours d’étude sur les 7 derniers jours')+'</p></div><p class="hint">'+tr('Self-reported activity, not assessed mastery. Earlier effort is retained after breaks.','Activité déclarée, sans évaluation de la maîtrise. Les efforts antérieurs sont conservés après une pause.')+'</p><div class="actions" style="margin-top:18px">'+button('Help me review my progress','M’aider à faire le point')+'</div><section class="assist"><h2>'+tr('A recap to reflect on','Un récapitulatif pour réfléchir')+'</h2><p>'+tr('You recorded 20 minutes across two study days and marked one of three steps complete. Your next unfinished step is writing your first page. You can continue at a pace that fits.','Vous avez enregistré 20 minutes sur deux jours et marqué une étape sur trois terminée. La prochaine étape consiste à écrire votre première page. Vous pouvez poursuivre à votre rythme.')+'</p><p class="hint">'+tr('OpenAI wording based only on the displayed counts. This does not establish skill level or readiness.','Formulation d’OpenAI basée uniquement sur les chiffres affichés. Elle n’établit ni un niveau de compétence ni une préparation.')+'</p><div class="actions">'+button('Return to my next step','Revenir à ma prochaine étape','primary')+button('Dismiss recap','Fermer le récapitulatif')+'</div></section></div><div><h2>'+tr('A commitment for your private circle','Un engagement pour votre cercle privé')+'</h2><p class="intro">'+tr( ck-in would help me keep it in mind.','Cette semaine, j’aimerais ouvrir ma page et ajouter un paragraphe. Un petit point ensemble m’aiderait à y penser.')+'</blockquote><p class="hint">'+tr('Private reflections, full plans and unshared history stay private. Circle members may remember what they have seen.','Vos réflexions privées, programmes complets et données non partagées restent privés. Les membres peuvent se souvenir de ce qu’ils ont vu.')+'</p><div class="actions">'+button('Share this copy','Partager cette copie','primary')+button('Back to editing','Revenir à la modification')+'</div></section>'+stateSamples;

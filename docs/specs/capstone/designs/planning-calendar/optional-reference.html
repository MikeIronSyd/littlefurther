<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planning calendar reference</title>
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;color-scheme:light;--page:#fbfcfd;--surface:#fff;--ink:#14263d;--muted:#4e6178;--line:#7a8a9f;--soft:#f6f8fa;--amber:#f2b52d;--band:#fff2d0}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);line-height:1.5}body.dark{color-scheme:dark;--page:#0e1922;--surface:#15232e;--ink:#e2eaf4;--muted:#b4c5d8;--line:#8298af;--soft:#12212c;--band:#342c18}header{padding:18px 24px;background:var(--soft);font-weight:650;font-size:21px}main{max-width:828px;padding:28px 24px;margin:auto}h1{font-size:30px;line-height:1.2;margin:0 0 24px}h2{font-size:22px;margin:0 0 12px}label,legend{font-weight:600}input{font:inherit;color:inherit;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}button{font:inherit;min-height:44px;border:1px solid transparent;border-radius:6px;padding:10px 14px;background:var(--soft);color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #175dab;outline-offset:3px}button:hover{border-color:var(--ink)}.primary{background:var(--amber);color:#17150f;font-weight:600}.field{display:grid;gap:6px;margin-bottom:20px}fieldset{min-width:0;border:0;padding:0;margin:0 0 20px}legend{padding:0;margin-bottom:8px}.picker{display:grid;grid-template-columns:minmax(0,1fr) 44px auto;gap:10px;align-items:end}.calendar{padding:10px}.calendar svg{display:block;width:22px;height:22px}.dates{list-style:none;display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:12px 0}.dates li{display:flex;align-items:center;gap:12px;padding-left:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:100%}.hint{color:var(--muted);margin:8px 0;font-size:14px}.ai{padding:20px;background:var(--band);border-radius:8px}.ai p{margin:8px 0}.ai ol{padding-left:24px}.ai a{color:inherit}.note{margin-top:24px;font-size:14px;color:var(--muted)}@media(max-width:600px){main{padding:22px 12px}header{padding:16px 12px}h1{font-size:26px}.picker{grid-template-columns:minmax(0,1fr) 44px}.picker .add{grid-column:1/-1}.dates{display:grid}.dates li{justify-content:space-between}.ai{padding:16px}}
</style></head><body><header>LittleFurther</header><main><h1>Shape a plan you can return to</h1><div class="field"><label for="topics">Your topics or sections (optional)</label><textarea id="topics" rows="5" style="font:inherit;min-width:0;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:inherit"></textarea><p class="hint">For a manual plan, add one action per line. For an AI plan, use Draft my plan with AI below; you do not need to enter topics here.</p></div><button type="button">Draft my plan with AI</button><p class="note">Focused optional-label precode reference • synthetic content • no provider call.</p></main></body></html>

<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LittleFurther usability/layout reference — synthetic</title>
  <style>
    :root {font-family:"Segoe UI",system-ui,sans-serif;color-scheme:light;--page:#fbfcfd;--surface:#fff;--sidebar:#f6f8fa;--ink:#14263d;--muted:#4e6178;--line:#d9e1e9;--control-line:#7a8a9f;--amber:#f2b52d;--amber-band:#fff2d0;--amber-ink:#392a0c;--error:#a02828;--focus:#175dab}
    :root[data-theme=dark] {color-scheme:dark;--page:#0e1922;--surface:#15232e;--sidebar:#12212c;--ink:#e2eaf4;--muted:#b4c5d8;--line:#344859;--control-line:#8298af;--amber-band:#342c18;--amber-ink:#fff0c6;--error:#ffb4b4;--focus:#8dc3ff}
    * {box-sizing:border-box} body {margin:0;background:var(--page);color:var(--ink);line-height:1.5} h1,h2,h3,h4,p {margin:0} button,input,textarea,select {font:inherit} button,a,input,textarea,select {outline-offset:3px} :focus-visible {outline:3px solid var(--focus)} .reference-note {padding:8px 16px;background:var(--sidebar);font-size:.875rem;color:var(--muted)}
    .header {display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;border-bottom:1px solid var(--line);padding:12px 24px} .brand-group,.brand,.utilities,.inline {display:flex;align-items:center;gap:16px} .brand {font-size:1.5rem;font-weight:650;gap:12px} .brand svg {width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} [data-theme=dark] .brand svg {color:var(--amber)} .icon {width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round} .control,.button {border:1px solid var(--control-line);border-radius:6px;background:var(--sidebar);color:var(--ink);min-height:44px;padding:10px 18px;font-weight:600} .control {min-width:44px;padding:10px;display:inline-flex;align-items:center;gap:8px} .button.primary {background:var(--amber);border-color:#a36c00;color:#17150f} .button:disabled {opacity:.5} .frame {display:grid;grid-template-columns:230px minmax(0,1fr)} aside {padding:24px 16px;border-right:1px solid var(--line);background:var(--sidebar)} aside a {display:block;color:var(--ink);padding:14px 16px;margin-bottom:12px;text-decoration:none} aside a:first-child {background:var(--amber-band);border-radius:6px} main {min-width:0;padding:28px;max-width:1500px} .hint {font-size:.875rem;color:var(--muted)}
    .workspace-heading {display:grid;grid-template-columns:1.2fr 1fr .7fr;gap:24px;align-items:center;margin-bottom:20px} .intro h1 {font-size:1.75rem;line-height:1.2} .intro p {margin-top:8px} .goal h2 {font-size:1.5rem;margin-bottom:8px} .next-band {display:flex;gap:28px;align-items:center;justify-content:space-between;background:var(--amber-band);color:var(--amber-ink);border-radius:12px;padding:28px 34px} .next-copy {min-width:0;flex:1} .next-copy h2 {font-size:1.95rem;line-height:1.25;margin:8px 0 16px} .next-meta {display:flex;align-items:center;gap:20px;flex-wrap:wrap} .next-actions {display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 1 320px} .study {width:100%;min-height:60px;font-size:1.2rem} .columns {display:grid;grid-template-columns:1.2fr 1fr;gap:40px;margin-top:32px} .columns h2 {font-size:1.35rem;margin-bottom:16px} .path {list-style:none;margin:0;padding:0} .path li {display:flex;gap:16px;align-items:center;margin-bottom:16px} .path button {text-align:left;width:100%} .support p {margin:12px 0 20px}
    .activity {max-width:75ch} .activity h1 {font-size:2rem;margin-bottom:24px} .activity section {margin-top:28px} .activity h2 {font-size:1.5rem;margin-bottom:12px} .activity h3 {font-size:1.2rem;margin-bottom:12px} .history {list-style:none;padding:0;margin:0} .history li {padding:16px 0;border-bottom:1px solid var(--line)} .history h4 {font-size:1rem;margin-bottom:6px} .rhythm {max-width:40rem;margin-top:20px;padding:20px;background:var(--sidebar);border-radius:12px} .rhythm ol {display:flex;gap:24px;padding:0;list-style:none;margin:16px 0} .rhythm li {text-align:center} .rhythm span {display:block;width:20px;height:20px;background:var(--control-line);border-radius:50%;margin:auto} .rhythm .studied {background:var(--amber)}
    .back-row {display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:20px} .back-row a {display:inline-flex;align-items:center;min-height:44px;color:var(--ink);text-underline-offset:.2em} .circle h1 {font-size:2rem;margin-bottom:12px} .circle .description {max-width:72ch;margin-bottom:24px} .circle .columns {margin-top:0} .panel {padding:20px;border:1px solid var(--line);border-radius:12px} .panel h2 {margin-bottom:12px} .panel p {margin-bottom:16px} .member {display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:16px 0}
    .specimens {display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:36px;border-top:1px solid var(--line);padding-top:28px} .specimens h2 {font-size:1.35rem;margin-bottom:16px} .field {display:flex;flex-direction:column;gap:8px;margin-bottom:20px} .field input,.field textarea {width:100%;min-width:0;border:1px solid var(--control-line);background:var(--surface);color:var(--ink);border-radius:6px;padding:10px 12px} .field input[aria-invalid] {border-color:var(--error)} .field-error {color:var(--error);font-size:.875rem} .checkbox {display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 0} .checkbox input {width:22px;height:22px;flex-shrink:0;accent-color:var(--amber)} .limit {margin-top:12px} .specimens .hint {margin-top:8px}
    @media(max-width:799px) {.header {padding:0;flex-wrap:wrap;gap:0}.brand-group {width:100%;padding:10px;min-height:64px}.brand {font-size:1.2rem;flex:1}.brand svg {width:29px;height:29px}.utilities {width:100%;justify-content:space-between;border-top:1px solid var(--line);padding:4px 16px;gap:14px}.frame {display:block}aside {display:none}main {padding:22px 16px}.workspace-heading {display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-bottom:16px}.goal {order:-1}.goal h2 {font-size:1.2rem}.intro h1 {font-size:1.5rem}.intro p {font-size:1rem;margin-top:6px}.workspace-heading .progress {display:none}.next-band {padding:20px;flex-direction:column;gap:20px;align-items:stretch}.next-copy h2 {font-size:1.65rem;margin:8px 0 12px}.next-meta {gap:12px}.next-actions {flex-basis:auto;align-items:stretch}.study {font-size:1.05rem}.columns,.specimens {grid-template-columns:minmax(0,1fr);gap:28px}.activity h1,.circle h1 {font-size:1.75rem}.rhythm {padding:16px}.rhythm ol {gap:16px;justify-content:space-between}.member {align-items:flex-start;flex-direction:column}.panel {padding:16px}}
  </style>
</head>
<body>
  <p class="reference-note">Synthetic pre-implementation reference · illustrative records · 11 October 2026</p>
  <div id="reference"></div>
  <script>
    const q=new URLSearchParams(location.search),fr=q.get('locale')==='fr',dark=q.get('theme')==='dark',view=q.get('view')||'learning';
    document.documentElement.lang=fr?'fr':'en';document.documentElement.dataset.theme=dark?'dark':'light';
    const tr=(en,french)=>fr?french:en;
    const svg=(shape)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${shape}</svg>`;
    const panel=svg('<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>');
    const moon=svg('<path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>');
    const sun=svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m4.93 4.93 1.41 1.41m17.66 17.66 1.41 1.41M2 12h2M20 12h2m6.34 17.66-1.41 1.41m19.07 4.93-1.41 1.41"/>');
    const b=(en,french,cls='')=>`<button type="button" class="button ${cls}">${tr(en,french)}</button>`;
    const header=`<header class="header"><div class="brand-group"><button class="control" aria-label="${tr('Hide navigation','Masquer la navigation')}">${panel}</button><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M5 7V25H17V7H27M17 15H25"/></svg><span>Little<wbr>Further</span></div></div><div class="utilities"><select class="control" aria-label="${tr('Language','Langue')}"><option>${tr('English','Français')}</option></select><button class="control" aria-label="${dark?tr('Switch to light mode','Passer au mode clair'):tr('Switch to dark mode','Passer au mode sombre')}">${dark?sun:moon}</button><button class="control" aria-label="${tr('Account','Compte')}">R ${svg('<path d="m6 9 6 6 6-6"/>')}</button></div></header>`;
    const nav=`<aside><a href="#">${tr('My learning','Mon apprentissage')}</a><a href="#">${tr('Journeys','Parcours')}</a><a href="#">${tr('Activity','Activité')}</a></aside>`;
    const goal=tr('Build a simple web page','Créer une page Web simple'),step=tr('Give the page structure','Structurer la page');
    const learning=`<div class="workspace-heading"><div class="intro"><h1>${tr('Your next step','Votre prochaine étape')}</h1><p>${tr('Keep going, one step at a time.','Continuez, une étape à la fois.')}</p></div><div class="goal"><h2>${goal}</h2>${b('Edit plan','Modifier le programme')}</div><p class="progress hint">${tr('1 of 3 steps complete','1 étape terminée sur 3')}</p></div><section class="next-band"><div class="next-copy"><p class="hint">${tr('Step 2 of 3','Étape 2 sur 3')}</p><h2>${step}</h2><div class="next-meta"><span>${tr('Estimated 20 minutes','Durée estimée : 20 minutes')}</span>${b('Edit this step','Modifier cette étape')}</div></div><div class="next-actions">${b('Start studying','Commencer à étudier','primary study')}${b('Try five minutes','Essayer cinq minutes')}</div></section><div class="columns"><section><h2>${tr('Your learning path','Votre parcours d’apprentissage')}</h2><ol class="path"><li>✓ ${tr('Add page content','Ajouter le contenu de la page')}</li><li>2 ${b('Give the page structure','Structurer la page')}</li><li>3 ${b('Review the page','Relire la page')}</li></ol></section><section class="support"><h2>${tr('Your completed work is still here.','Votre travail terminé est conservé.')}</h2><p>${tr('Return when you are ready.','Reprenez quand vous êtes prêt.')}</p>${b('Review restart dates','Revoir les dates de reprise')}</section></div>`;
    const activity=`<div class="activity"><h1>${tr('Activity','Activité')}</h1><h2>${goal}</h2><p class="hint">${tr('Earlier activity and completed work stay in your history when the active plan changes.','Les activités et étapes terminées restent dans votre historique quand le programme actif change.')}</p><div class="rhythm"><h3>${tr('1 study day this week','1 jour d’étude cette semaine')}</h3><p class="hint">5–11 ${tr('October','octobre')} · Africa/Lagos</p><ol>${[5,6,7,8,9,10,11].map((n)=>`<li><span class="${n===10?'studied':''}"></span>${n}</li>`).join('')}</ol><p class="hint">${tr('Self-reported activity, not assessed mastery.','Activité déclarée, pas une maîtrise évaluée.')}</p></div><section><h2>${tr('Retained history','Historique conservé')}</h2><section><h3>${tr('Study sessions','Séances d’étude')}</h3><ol class="history"><li><h4>${tr('Add page content','Ajouter le contenu de la page')}</h4><p class="hint">10 ${tr('October','octobre')} · 20 min</p><p>${tr('I practised the first page structure.','J’ai pratiqué la structure de la première page.')}</p></li></ol></section><section><h3>${tr('Completed steps','Étapes terminées')}</h3><ol class="history"><li><h4>${tr('Add page content','Ajouter le contenu de la page')}</h4><p class="hint">10 ${tr('October','octobre')}</p></li></ol></section><section><h3>${tr('Plan changes','Modifications du programme')}</h3><p class="hint">${tr('Active scope changed from 2 to 3 steps.','Le parcours actif est passé de 2 à 3 étapes.')}</p></section></section></div>`;
    const circle=`<div class="circle"><nav class="back-row" aria-label="${tr('Study circle navigation','Navigation du cercle d’étude')}"><a href="#">${tr('Back to my learning','Retour à mon apprentissage')}</a><a href="#">${tr('Back to circles','Retour aux cercles')}</a></nav><h1>${tr('Weekend study circle','Cercle d’étude du week-end')}</h1><p class="description">${tr('Private support with trusted peers. Only the information you choose to share is visible here.','Soutien privé avec des personnes de confiance. Seules les informations que vous choisissez de partager sont visibles ici.')}</p><div class="columns"><section class="panel"><h2>${tr('Shared check-ins','Points partagés')}</h2><p>${tr('Give the page structure','Structurer la page')}</p>${b('Share a check-in','Partager un point')}</section><section class="panel"><h2>${tr('Members','Membres')}</h2><div class="member"><span>Reign</span><span class="hint">${tr('Owner','Propriétaire')}</span></div><div class="member"><span>Amara</span><button class="button" aria-label="${tr('Remove member: Amara','Retirer le membre : Amara')}">${tr('Remove member','Retirer le membre')}</button></div></section></div></div>`;
    const forms=`<div class="specimens"><section><h2>${tr('Specific field feedback','Erreur associée au champ')}</h2><div class="field"><label for="timezone">${tr('Study timezone','Fuseau horaire d’étude')}</label><input id="timezone" value="Not/A_Timezone" aria-invalid="true" aria-describedby="zone-hint zone-error"><p class="hint" id="zone-hint">${tr('Choose a suggestion or enter a timezone such as Africa/Lagos. This controls study dates.','Choisissez une suggestion ou saisissez un fuseau comme Africa/Lagos. Il détermine les dates d’étude.')}</p><p id="zone-error" class="field-error">${tr('Enter a valid timezone, for example Africa/Lagos or Europe/Paris.','Saisissez un fuseau valide, par exemple Africa/Lagos ou Europe/Paris.')}</p></div><div class="field"><label for="minutes">${tr('Minutes you studied','Minutes étudiées')}</label><input id="minutes" type="number" value="20"><p class="hint">${tr('Starts with the estimate. Change it to the whole number of minutes you actually studied; it is not timed.','La durée estimée est proposée. Indiquez le nombre entier de minutes réellement étudiées ; aucun chronomètre ne mesure cette durée.')}</p></div></section><section><h2>${tr('Limits and deliberate consent','Limites et consentement explicite')}</h2><button class="button" type="button" disabled aria-describedby="step-limit">${tr('Add step','Ajouter une étape')}</button><p class="hint limit" id="step-limit">${tr('50 of 50 steps. Remove a step to add another.','50 étapes sur 50. Retirez une étape pour en ajouter une autre.')}</p><label class="checkbox"><input type="checkbox"><span>${tr('I understand these dates have conflicts.','Je comprends que ces dates présentent des conflits.')}</span></label><div class="field"><label for="dates">${tr('Available dates','Dates disponibles')}</label><textarea id="dates" rows="2">2026-10-12\n2026-10-14</textarea><p class="hint">${tr('Use YYYY-MM-DD, one date per line or separated by commas. For example: 2026-10-12, 2026-10-14.','Utilisez AAAA-MM-JJ, une date par ligne ou séparée par des virgules. Exemple : 2026-10-12, 2026-10-14.')}</p></div></section></div>`;
    document.getElementById('reference').innerHTML=header+`<div class="frame">${nav}<main>${view==='activity'?activity:view==='circle'?circle:learning}${view==='learning'?forms:''}</main></div>`;
  </script>
</body>
</html>

    <div class="utilities"><select aria-label="Language"><option>English</option><option>Français</option></select><button class="icon-only" aria-label="Switch to dark mode" id="theme-button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></button><button class="account" aria-label="Account"><span class="avatar" aria-hidden="true">R</span><span class="account-name">Reference learner</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>

  <template id="planning">
    <div class="intro"><a href="#learning">Back</a><h1>Shape a plan you can return to</h1><p class="subtitle">Review every step before saving.</p></div>
    <div class="field"><label for="goal">Learning goal</label><input id="goal" value="Build a small web page"></div>
    <fieldset class="mode-choice"><legend>How would you like to draft your plan?</legend><div class="mode-options"><label class="mode-option"><input type="radio" name="draft-mode"><span>Use my own topics</span></label><label class="mode-option selected"><input type="radio" name="draft-mode" checked><span>Get an AI draft</span></label></div></fieldset>
    <p class="hint" style="margin-top:10px">You can switch routes without losing what you entered.</p>
    <section class="scheduling"><h2>Make time for small steps</h2><div class="inline-fields" style="margin-top:16px"><div class="field"><label for="start">Start date</label><input id="start" type="date" value="2026-10-18"></div><div class="field"><label for="minutes">Minutes per session</label><input id="minutes" type="number" value="10"></div></div><details class="manage"><summary>Availability and optional plan details</summary><div class="stack" style="margin-top:16px"><div class="field"><label for="available">Dates you are available</label><div class="calendar-line"><input id="available" type="date" value="2026-10-18"><button>Add date</button></div></div><div class="field"><label for="target">Fixed target date (optional)</label><input id="target" type="date"></div></div></details></section>
    <section class="ai-route"><h2>Get help drafting your plan</h2><div class="inline-fields"><div class="field"><label for="knowledge">What you already know (optional)</label><input id="knowledge" value="I am starting with HTML."></div><div class="field"><label for="links">Reference links (optional)</label><input id="links" value="https://developer.mozilla.org/"></div></div><label class="check" style="margin-top:14px"><input type="checkbox" checked><span>Search the web for credible learning resources</span></label><p class="privacy">Your goal, starting point, pasted material and supplied links are sent to OpenAI. When search is selected, relevant learning topics are also used for web search. Review the draft before saving.</p><div class="actions"><button>Draft my plan with AI</button></div></section>
    <section class="review"><h2>Review your draft steps</h2><p class="hint">AI can make mistakes. Review this suggestion; your existing work is unchanged.</p><ol class="step-list"><li class="review-step"><h3>Write a descriptive heading</h3><div class="inline-fields"><div class="field"><label for="action1">Action</label><textarea id="action1">Write one heading for your page and explain what it introduces.</textarea></div><div class="field"><label for="estimate1">Estimated minutes</label><input id="estimate1" type="number" value="5"></div></div><ul class="source-links"><li><a href="#source-mdn">MDN: Headings and paragraphs</a></li></ul><div class="actions"><button disabled>Move up</button><button>Move down</button><button>Remove</button></div></li><li class="review-step"><h3>Add a short paragraph</h3><div class="inline-fields"><div class="field"><label for="action2">Action</label><input id="action2" value="Add a paragraph about something you enjoy."></div><div class="field"><label for="estimate2">Estimated minutes</label><input id="estimate2" type="number" value="10"></div></div><ul class="source-links"><li><a href="#source-mdn">MDN: Headings and paragraphs</a></li></ul><div class="actions"><button>Move up</button><button>Move down</button><button>Remove</button></div></li><li class="review-step"><h3>Review the page structure</h3><div class="inline-fields"><div class="field"><label for="action3">Action</label><input id="action3" value="Open the page and check its heading and paragraph."></div><div class="field"><label for="estimate3">Estimated minutes</label><input id="estimate3" type="number" value="10"></div></div><ul class="source-links"><li><a href="#source-mdn">MDN: Headings and paragraphs</a></li></ul><div class="actions"><button>Move up</button><button disabled>Move down</button><button>Remove</button></div></li></ol><button style="margin-top:16px">Add step</button></section>
    <section class="sources-section"><h2>Resources</h2><ul class="source-catalogue"><li id="source-mdn"><a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Headings_and_paragraphs">MDN: Headings and paragraphs</a><p class="hint">MDN Web Docs · Cited in search</p><details><summary>Source details</summary><p>Returned by web search; review suitability before using.</p><p>Recorded 17 Oct 2026 · URL language hint: English</p><p>This synthetic reference does not establish a real search result.</p></details></li></ul><p class="hint" style="margin-top:12px">Source language, free access, accuracy and current availability are not guaranteed. Search listings or citations do not prove that a full page was read.</p></section><div class="form-footer"><button class="primary">Confirm and save plan</button></div>
  </template>
  <template id="study">
    <div class="intro"><a href="#learning">Back to my learning</a><h1>After studying</h1><p class="subtitle">Add a private reflection during your session, or skip it and choose your next step.</p></div><div class="study-heading"><div><h2>Write a descriptive heading</h2><p class="hint">Build a small web page · Estimated 5 minutes</p></div></div><p class="study-resource"><a href="https://developer.mozilla.org/">MDN: Headings and paragraphs</a></p><div class="study-form" style="margin-top:20px"><div class="field"><label for="studied">Minutes you studied</label><input id="studied" type="number" value="5"><p>Record the time you actually spent studying.</p></div><div class="field"><label for="reflection">Private reflection (optional)</label><textarea id="reflection">I can explain what this heading introduces.</textarea><p>Your private reflection is not shared with your circle.</p></div><div class="actions"><button class="primary">Save study session</button></div></div><details class="manage study-assistance"><summary>Help with studying and reflection</summary><div class="manage-content"><p class="privacy">OpenAI receives your goal, this step, associated source metadata and plan reference links. This reflection draft is sent only if you select the option below. Saved reflections and other people's records are not sent. Nothing is saved or completed automatically.</p><label class="check"><input type="checkbox"><span>Include this reflection draft in study help</span></label><button>Help me study and reflect</button></div></details><section class="completion-section"><h2>Finish the step when you are ready</h2><p style="margin-top:12px">Saving a study session records your effort. Completing a step is a separate action.</p><button>Mark this step complete</button></section><div class="section"><a href="#learning" class="button" style="display:inline-flex;align-items:center">Choose the next action</a></div>
  </template>
  <template id="activity">
    <div class="intro"><h1>Activity</h1><h2 style="margin-top:20px">Build a small web page</h2><p class="subtitle" style="margin-top:10px">Earlier activity and completed work stay in your history when the active plan changes.</p></div><section><h2>Every study day counts.</h2><div class="activity-stats"><div><strong>2 study days</strong><span class="hint">15–21 Oct 2026</span></div><div><strong>15 minutes</strong><span class="hint">2 saved sessions</span></div></div><ol class="rhythm" aria-label="Recorded study days"><li class="studied"><i></i>15</li><li><i></i>16</li><li class="studied"><i></i>17</li><li><i></i>18</li><li><i></i>19</li><li><i></i>20</li><li><i></i>21</li></ol><p class="hint">Minutes are learner-reported.</p></section><section class="section separated"><h2>Retained history</h2><p class="hint" style="margin-top:8px">1 counted completion · Corrected records remain below.</p><h3 class="records-title">2 study sessions</h3><article class="record"><h3>Write a descriptive heading</h3><p class="meta">17 Oct 2026, 10:00 · 5 minutes</p><p class="reflection-label">Private reflection</p><p>I can explain what this heading introduces.</p><details class="manage"><summary>Manage study record</summary><div class="manage-content"><button class="danger">Delete study session</button><button class="danger">Remove private reflection</button></div></details></article><article class="record"><h3>Add a short paragraph</h3><p class="meta">15 Oct 2026, 14:30 · 10 minutes</p><details class="manage"><summary>Manage study record</summary><div class="manage-content"><button class="danger">Delete study session</button></div></details></article><h3 class="records-title">Completed steps</h3><article class="record"><h3>Write a descriptive heading</h3><p><span class="status">Complete</span></p><p class="meta">17 Oct 2026, 10:05</p><details class="manage"><summary>Manage completion record</summary><div class="manage-content"><button>Mark as unfinished</button></div></details></article><article class="record"><h3>Add a short paragraph</h3><p><span class="status">Completion corrected</span></p><p class="meta">15 Oct 2026, 14:40</p><p class="hint">Kept in history and excluded from completion totals.</p></article></section><details class="manage activity-help"><summary>Reflect on your recorded effort</summary><div class="manage-content"><p class="privacy">OpenAI receives recorded counts and study-action facts. Private reflections are not sent. Your recorded numbers remain the source of truth; a recap is not an assessment of mastery.</p><button>Summarize my progress</button></div></details><section class="section separated"><h2>Removed steps</h2><p class="hint" style="margin-top:10px">Review steps removed from this plan. Restoring a step appends it to the path with its original date; deleted study records do not return.</p><p style="margin-top:14px">No removed steps to restore.</p></section>

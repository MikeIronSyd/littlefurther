<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LittleFurther control/readability reference — synthetic</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI",system-ui,sans-serif; --page:#fbfcfd; --surface:#fff; --sidebar:#f6f8fa; --ink:#14263d; --heading:#111820; --muted:#4e6178; --line:#d9e1e9; --control-line:#7a8a9f; --amber:#f2b52d; --amber-band:#fff2d0; --amber-ink:#392a0c; --blue:#edf5ff; --blue-ink:#173758; --focus:#175dab; --green:#247246; }
    :root[data-theme=dark] { color-scheme:dark; --page:#0e1922; --surface:#15232e; --sidebar:#12212c; --ink:#e2eaf4; --heading:#f5f7fa; --muted:#b4c5d8; --line:#344859; --control-line:#8298af; --amber-band:#342c18; --amber-ink:#fff0c6; --blue:#192f43; --blue-ink:#d6e9ff; --focus:#91c5ff; --green:#63c28b; }
    * {box-sizing:border-box} body {margin:0;background:var(--page);color:var(--ink);font-size:1rem;line-height:1.5} button,input,select {font:inherit;color:inherit} button,summary {cursor:pointer} h1,h2,h3,p {margin:0} h1,h2,h3 {line-height:1.2;color:var(--heading);overflow-wrap:anywhere} h1 {font-size:3rem;letter-spacing:-.035em} h2 {font-size:1.35rem;letter-spacing:-.02em} h3 {font-size:1.1rem} button,a,summary {text-underline-offset:.2em} :focus-visible {outline:3px solid var(--focus);outline-offset:3px} button:disabled {opacity:.55;cursor:not-allowed}
    .reference-note {margin:0;padding:8px 16px;border-bottom:1px solid var(--line);font-size:.875rem;color:var(--muted)}
    .icon {width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .app-header {min-height:72px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--surface);border-bottom:1px solid var(--line)} .brand-group {display:flex;align-items:center;min-width:0} .brand {display:flex;align-items:center;gap:16px;padding:16px 22px;min-width:0;font-size:1.35rem;font-weight:650} .brand-name {min-width:0;line-height:1.1} .brand-mark {width:32px;height:32px;flex:none;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} :root[data-theme=dark] .brand-mark {color:var(--amber)}
    .nav-trigger {display:grid;place-items:center;width:44px;min-height:44px;flex:none;margin:14px;border:1px solid var(--control-line);border-radius:6px;background:var(--sidebar)} .utilities {display:flex;align-items:center;gap:20px;padding-right:24px;min-width:0} .language-select {border:1px solid var(--control-line);border-radius:6px;background:var(--sidebar);padding:9px 10px;min-height:44px;max-width:100%} .theme-button {display:grid;place-items:center;width:44px;min-height:44px;padding:8px;border:1px solid var(--control-line);border-radius:6px;background:var(--sidebar)} .account-summary {display:flex;align-items:center;gap:9px;min-width:44px;min-height:44px;list-style:none;border:1px solid var(--control-line);border-radius:6px;background:var(--sidebar);padding:3px 7px} .account-summary::-webkit-details-marker {display:none} .avatar {display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:600} .chevron {width:14px;height:14px;flex:none} .account-items {padding:8px;position:absolute;right:20px;background:var(--surface);border:1px solid var(--line)}
    .utilities {flex-wrap:wrap} .app-frame {display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 110px)} .sidebar {padding:24px 10px;background:var(--sidebar);border-right:1px solid var(--line)} .nav-links {display:flex;flex-direction:column;gap:6px} .nav-link {display:flex;align-items:center;gap:18px;color:inherit;padding:15px 18px;border-radius:10px;text-decoration:none;min-height:54px} .nav-link[aria-current=page] {background:var(--amber-band);color:var(--amber-ink);font-weight:650}
    .workspace {padding:30px 28px 42px;min-width:0} .workspace-heading {display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(210px,.75fr);gap:24px;align-items:center;margin-bottom:24px} .workspace-heading h1 {white-space:normal} .goal-heading h2 {font-size:1.65rem;margin-bottom:6px} .hint {font-size:.91rem;color:var(--muted)} .meta {font-size:.875rem;color:var(--muted)} progress {width:100%;accent-color:#a36c00} .next-band {display:flex;align-items:center;justify-content:space-between;gap:30px;padding:28px 34px;background:var(--amber-band);color:var(--amber-ink);border-radius:12px;min-height:200px} .next-band h2 {font-size:1.95rem;color:inherit;margin:10px 0 16px} .next-copy {min-width:0;flex:1} .next-actions {display:flex;flex-direction:column;gap:10px;align-items:stretch;flex:0 1 345px} .inline-icon {display:inline-flex;gap:10px;align-items:center}
    .button {border:1px solid var(--control-line);background:var(--sidebar);color:var(--ink);border-radius:6px;padding:10px 18px;min-height:44px;font-weight:600;text-align:center;white-space:normal} .button:hover:not(:disabled),.nav-trigger:hover,.theme-button:hover,.account-summary:hover {background:var(--surface);border-color:var(--ink)} .button.primary {background:var(--amber);border-color:#a36c00;color:#17150f} .button.primary:hover {background:#e3a219} .button.small {font-size:.875rem;padding:8px 12px} .text-link {color:inherit;text-decoration:underline;min-height:44px;display:inline-flex;align-items:center;padding:8px 0} .study-primary {min-height:60px;font-size:1.2rem} .journey-columns {display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:24px;margin-top:20px} .path-section {padding-right:20px;border-right:1px solid var(--line)} .learning-path {list-style:none;padding:0;margin:14px 0 20px} .path-step {display:flex;align-items:center;gap:16px;min-height:60px;padding:6px 8px} .path-step.current {background:var(--amber-band);border-radius:10px} .path-marker {display:grid;place-items:center;width:40px;height:40px;flex:none;border:2px solid var(--control-line);border-radius:50%;font-variant-numeric:tabular-nums} .completed .path-marker {background:var(--green);color:var(--surface);border-color:var(--green)} .current .path-marker {background:var(--amber);color:#17150f;border-color:#9b6700} .path-action {flex:1;min-width:0;text-align:left;padding:9px 12px;border:1px solid var(--control-line);border-radius:6px;background:var(--sidebar)} .path-title {display:block;font-size:1.05rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere} .path-description {display:block;font-size:.875rem;color:var(--muted);margin-top:3px} .path-action:hover .path-title {text-decoration:underline}
    .support-column {display:flex;flex-direction:column;gap:14px;min-width:0} .support {display:flex;gap:18px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:20px 22px} .support > .icon {width:34px;height:34px} .support h2 {margin-bottom:8px} .support p {margin-bottom:12px} .return-support {background:var(--blue);color:var(--blue-ink)} .return-support h2 {color:inherit} .reference-sections {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;margin-top:36px;padding-top:28px;border-top:1px solid var(--line)} .row-actions {display:flex;flex-wrap:wrap;gap:10px;margin-top:16px} .activity-section {display:flex;flex-direction:column;gap:10px;margin-top:28px} .activity-section:first-child {margin-top:0} .history-list {padding-left:22px;margin:0} .history-list li+li {margin-top:12px}
    .signed-out {display:block} .auth-layout {display:grid;grid-template-columns:1.1fr .9fr;gap:70px;max-width:1050px;margin:7vh auto} .auth-intro {padding:28px;background:var(--amber-band);color:var(--amber-ink);border-radius:12px;align-self:start} .auth-intro h1 {color:inherit;font-size:3rem;margin-bottom:20px} .auth-intro p {font-size:1rem;line-height:1.5} .auth-form {display:flex;flex-direction:column;gap:20px;min-width:0} .field {display:flex;flex-direction:column;gap:6px;min-width:0} input {width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--control-line);border-radius:6px;background:var(--surface)} .password-control {position:relative} .password-control input {min-height:48px;padding-right:56px} .password-reveal {display:grid;place-items:center;position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:transparent;border-radius:4px}
    @media(max-width:1250px) {.workspace-heading {grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .workspace-heading h1 {grid-column:1/-1} .account-name {display:none}}
    @media(max-width:799px) {.app-header {flex-wrap:wrap;gap:0} .brand-group {width:100%} .brand {padding:14px 16px;gap:12px;font-size:1.2rem} .brand-mark {width:29px;height:29px} .nav-trigger {margin:10px;width:44px;min-height:44px} .utilities {width:100%;padding:4px 16px;gap:14px;justify-content:space-between;border-top:1px solid var(--line)} .language-select {font-size:.9rem;padding-inline:8px} .account-summary {gap:2px;padding:3px} .avatar {width:30px;height:30px} .app-frame {display:block} .sidebar {display:none} .workspace {padding:24px 16px 32px} .workspace-heading {display:flex;flex-direction:column;align-items:stretch;gap:18px} .workspace-heading h1 {font-size:2rem} .goal-heading h2 {font-size:1.55rem} .next-band {flex-direction:column;align-items:stretch;padding:22px;gap:20px} .next-band h2 {font-size:1.65rem} .next-actions {flex-basis:auto} .study-primary {font-size:1rem;min-height:52px} .journey-columns,.reference-sections {display:flex;flex-direction:column} .path-section {padding-right:0;border-right:0} .support {padding:18px;gap:14px} .support>.icon {width:27px;height:27px} .support h2 {font-size:1.15rem} .path-step {gap:12px;padding-inline:4px} .path-action {padding:9px} .auth-layout {display:flex;flex-direction:column;margin-block:10px;gap:20px} .auth-intro {padding:16px} .auth-intro h1 {font-size:1.75rem;margin-bottom:20px} .auth-form {width:100%} }
  </style>
</head>
<body>
  <p class="reference-note">Synthetic pre-implementation reference · 11 October 2026 · illustrative learning records</p>
  <div id="reference"></div>
  <script>
    const query = new URLSearchParams(location.search);
    const fr = query.get("locale") === "fr";
    const dark = query.get("theme") === "dark";
    const auth = query.get("view") === "auth";
    document.documentElement.lang = fr ? "fr" : "en";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const tr = (en, french) => fr ? french : en;
    const paths = {home:"m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9",path:"m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2ZM9 3v16M15 5v16",activity:"M5 20V13M12 20V7M19 20V3",check:"m5 12 4 4 10-10",clock:"M12 7v5l3 2M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9",people:"M15 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0M2 21v-2a7 7 0 0 1 14 0v2ZM18 4a4 4 0 0 1 0 8M18 15a5 5 0 0 1 4 5v1",chevron:"m6 9 6 6 6-6",moon:"M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"};
    function icon(kind) { const shape = kind === "panel" ? '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>' : kind === "sun" ? '<circle cx="12" cy="12" r="4"/>'+["M12 2v2","M12 20v2","m4.93 4.93 1.41 1.41","m17.66 17.66 1.41 1.41","M2 12h2","M20 12h2","m6.34 17.66-1.41 1.41","m19.07 4.93-1.41 1.41"].map(d=>`<path d="${d}"/>`).join("") : kind === "eye" ? '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>' : `<path d="${paths[kind]}"/>`; return `<svg class="icon ${kind==='chevron'?'chevron':''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${shape}</svg>`; }
    const brand = '<div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M5 7V25H17V7H27M17 15H25"/></svg><span class="brand-name">Little<wbr>Further</span></div>';
    const button = (en, french, type="") => `<button type="button" class="button ${type}">${tr(en,french)}</button>`;
    const header = `<header class="app-header"><div class="brand-group">${auth?'':`<button type="button" class="nav-trigger" aria-label="${tr('Hide navigation','Masquer la navigation')}">${icon('panel')}</button>`}${brand}</div><div class="utilities"><select class="language-select" aria-label="${tr('Language','Langue')}"><option>${tr('English','Français')}</option></select><button type="button" class="theme-button" aria-label="${dark?tr('Switch to light mode','Passer au mode clair'):tr('Switch to dark mode','Passer au mode sombre')}">${icon(dark?'sun':'moon')}</button>${auth?'':`<details><summary class="account-summary" aria-label="${tr('Account','Compte')}"><span class="avatar" aria-hidden="true">R</span><span class="account-name">Reign</span>${icon('chevron')}</summary><div class="account-items">${tr('Preferences','Préférences')}</div></details>`}</div></header>`;
    const navigation = `<aside class="sidebar"><nav class="nav-links">${[['home','My learning','Mon apprentissage'],['path','Journeys','Parcours'],['activity','Activity','Activité']].map(([kind,en,french],index)=>`<a class="nav-link" ${index===0?'aria-current="page"':''} href="#">${icon(kind)}${tr(en,french)}</a>`).join('')}</nav></aside>`;
    const welcome = `<div class="auth-layout"><section class="auth-intro"><h1>${tr('Keep learning, even when life interrupts.','Continuez à apprendre, malgré les imprévus.')}</h1><p>${tr('Build a flexible study plan, study and reflect in small steps, and see your progress. Return after a break with your earlier effort intact, and invite trusted peers for private support when you want it.','Créez un programme d’étude souple, étudiez par petites étapes, faites le point et suivez vos progrès. Reprenez après une pause en conservant la trace de vos efforts, et invitez des personnes de confiance dans un cercle privé pour vous soutenir, si vous le souhaitez.')}</p></section><form class="auth-form" onsubmit="return false"><h2>${tr('Sign in','Se connecter')}</h2><label class="field">${tr('Email address','Adresse e-mail')}<input type="email" autocomplete="off"></label><label class="field">${tr('Password','Mot de passe')}<span class="password-control"><input type="password" autocomplete="off"><button type="button" class="password-reveal" aria-label="${tr('Show password','Afficher le mot de passe')}">${icon('eye')}</button></span><span class="hint">${tr('Use 8–128 characters.','Utilisez 8 à 128 caractères.')}</span></label>${button('Sign in','Se connecter','primary')}<a class="text-link" href="#">${tr('New here? Create an account','Première visite ? Créer un compte')}</a></form></div>`;
    const goal = tr('Build a simple web page','Créer une page Web simple');
    const pathRows = [['completed','Add page content','Ajouter le contenu de la page'],['current','Give the page structure','Structurer la page'],['','Review the page','Relire la page']].map(([state,en,french],index)=>`<li class="path-step ${state}"><span class="path-marker" aria-hidden="true">${index===0?icon('check'):index+1}</span>${index===0?`<span><span class="path-title">${tr(en,french)}</span><span class="path-description">${tr('Completed','Terminée')}</span></span>`:`<button type="button" class="path-action"><span class="path-title">${tr(en,french)}</span><span class="path-description">${tr('12 October · 20 min','12 octobre · 20 min')}</span></button>`}</li>`).join('');
    const learning = `<div class="workspace-heading"><h1>${tr('My learning','Mon apprentissage')}</h1><div class="goal-heading"><h2>${goal}</h2><p class="hint">${tr('Your next manageable action','Votre prochaine petite action')}</p></div><div><p>${tr('1 of 3 steps complete','1 étape terminée sur 3')}</p><progress value="1" max="3"></progress></div></div><section class="next-band"><div class="next-copy"><p>${tr('Step 2 of 3','Étape 2 sur 3')}</p><h2>${tr('Give the page structure','Structurer la page')}</h2><span class="inline-icon">${icon('clock')}20 min</span></div><div class="next-actions">${button('Start studying','Commencer à étudier','primary study-primary')}${button('Edit this step','Modifier cette étape')}</div></section><div class="journey-columns"><section class="path-section"><h2>${tr('Your learning path','Votre parcours d’apprentissage')}</h2><ol class="learning-path">${pathRows}</ol>${button('Edit plan','Modifier le programme')}</section><div class="support-column"><section class="support return-support">${icon('clock')}<div><h2>${tr('Your completed work is still here.','Votre travail terminé est conservé.')}</h2><p>${tr('You can restart with five minutes whenever you are ready.','Vous pouvez reprendre avec cinq minutes quand vous le souhaitez.')}</p><div class="row-actions">${button('Try five minutes','Essayer cinq minutes')}${button('Review restart dates','Revoir les dates de reprise')}</div></div></section><section class="support">${icon('people')}<div><h2>${tr('Study together','Étudier ensemble')}</h2><p>${tr('Invite trusted peers for private support when you want it.','Invitez des personnes de confiance dans un cercle privé pour vous soutenir, si vous le souhaitez.')}</p>${button('Open study circles','Ouvrir les cercles d’étude')}</div></section></div></div><div class="reference-sections"><section><h2>${tr('Editor actions','Actions de modification')}</h2><p class="hint">${tr('Synthetic control specimen; the first move is disabled.','Exemple synthétique de commandes ; le premier déplacement est désactivé.')}</p><div class="row-actions"><button type="button" class="button small" disabled>${tr('Move up','Monter')}</button>${button('Move down','Descendre','small')}${button('Remove','Retirer','small')}</div></section><section><h2>${tr('Activity','Activité')}</h2><div class="activity-section"><h3>${goal}</h3><p class="hint">${tr('Earlier activity and completed work stay in your history when the active plan changes.','Les activités et étapes terminées restent dans votre historique quand le programme actif change.')}</p></div><section class="activity-section"><h3>${tr('Retained history','Historique conservé')}</h3><p>${tr('1 completion recorded in history','1 étape terminée dans l’historique')}</p></section><section class="activity-section"><h3>${tr('2 study sessions','2 séances d’étude')}</h3><ol class="history-list"><li>${tr('20 minutes · 10 October','20 minutes · 10 octobre')}</li><li>${tr('15 minutes · 11 October','15 minutes · 11 octobre')}</li></ol></section></section></div>`;
    document.getElementById('reference').innerHTML = header + `<div class="app-frame ${auth?'signed-out':''}">${auth?'':navigation}<main class="workspace">${auth?welcome:learning}</main></div>`;
  </script>
</body>
</html>

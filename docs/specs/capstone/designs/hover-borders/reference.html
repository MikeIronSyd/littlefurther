<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LittleFurther · Synthetic border reference</title>
  <style>
    :root { color-scheme:light; font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif; --page:#fbfcfd; --surface:#fff; --sidebar:#f6f8fa; --ink:#14263d; --heading:#111820; --muted:#4e6178; --line:#d9e1e9; --control-line:#7a8a9f; --amber:#f2b52d; --amber-hover:#e3a219; --amber-band:#fff2d0; --amber-ink:#392a0c; --focus:#175dab; --brand:#14263d; }
    :root[data-theme="dark"] { color-scheme:dark; --page:#0e1922; --surface:#15232e; --sidebar:#12212c; --ink:#e2eaf4; --heading:#f5f7fa; --muted:#b4c5d8; --line:#344859; --control-line:#8298af; --amber-band:#342c18; --amber-ink:#fff0c6; --focus:#91c5ff; --brand:#f2b52d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font-size:1rem; line-height:1.5; }
    h1,h2,h3,p { margin:0; }
    h1,h2,h3 { color:var(--heading); line-height:1.2; overflow-wrap:anywhere; }
    h1 { font-size:1.75rem; font-weight:750; letter-spacing:-.035em; }
    h2 { font-size:1.25rem; font-weight:650; letter-spacing:-.02em; }
    h3 { font-size:1rem; font-weight:600; }
    button,input,select,summary { font:inherit; color:inherit; touch-action:manipulation; }
    button,summary { cursor:pointer; }
    :focus-visible,.state-focus { outline:3px solid var(--focus); outline-offset:3px; }
    .icon { width:24px; height:24px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .app-header { min-height:72px; display:flex; justify-content:space-between; align-items:center; gap:1rem; background:var(--surface); border-bottom:1px solid var(--line); }
    .brand-group { display:flex; align-items:center; min-width:0; }
    .brand { display:flex; align-items:center; gap:16px; padding:16px 22px; min-width:0; font-size:1.35rem; font-weight:650; }
    .brand-name { min-width:0; line-height:1.1; }
    .brand-mark { display:block; width:32px; height:32px; color:var(--brand); flex:0 0 auto; }
    .nav-trigger { display:grid; place-items:center; width:44px; height:44px; flex:0 0 44px; margin:14px; padding:6px; border:0; border-radius:6px; background:transparent; }
    .nav-trigger .icon { width:29px; height:29px; stroke-width:2; }
    .utilities { display:flex; flex-wrap:wrap; align-items:center; gap:20px; padding-right:24px; min-width:0; }
    .language-select { width:auto; max-width:100%; min-width:44px; min-height:44px; padding:10px 12px; }
    .theme-button { display:grid; place-items:center; width:44px; min-height:44px; padding:8px; }
    .account-summary { display:flex; align-items:center; gap:9px; min-width:44px; min-height:44px; padding:4px 8px; list-style:none; }
    .account-summary::-webkit-details-marker { display:none; }
    .account-chevron { width:18px; height:18px; }
    .avatar { width:36px; height:36px; display:grid; place-items:center; background:var(--sidebar); border-radius:50%; font-weight:600; }
    .account-name { max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .button { min-width:44px; min-height:44px; padding:10px 18px; border-radius:6px; font-weight:600; text-align:center; }
    .secondary,.language-select,.theme-button,.account-summary,.circle-management summary { border:1px solid transparent; border-radius:6px; background:var(--sidebar); transition:border-color 150ms ease-out; }
    .secondary:not(:disabled):is(:focus-visible,:active),.language-select:is(:focus-visible,:active),.theme-button:not(:disabled):is(:focus-visible,:active),.account-summary:is(:focus-visible,:active),.circle-management summary:is(:focus-visible,:active),.state-hover.secondary,.state-focus.secondary,.state-hover.theme-button,.state-focus.theme-button { border-color:var(--brand); }
    .nav-trigger:is(:active,.state-hover) { background:var(--sidebar); }
    @media (hover:hover) and (pointer:fine) {
      .secondary:hover:not(:disabled),.language-select:hover,.theme-button:hover:not(:disabled),.account-summary:hover,.circle-management summary:hover { border-color:var(--brand); }
      .nav-trigger:hover:not(:disabled) { background:var(--sidebar); }
    }
    .button:disabled { opacity:.55; cursor:not-allowed; }
    .primary { border:1px solid #a36c00; background:var(--amber); color:#17150f; }
    .path-action { min-width:44px; min-height:44px; padding:8px 12px; text-align:left; border:1px solid var(--control-line); border-radius:6px; background:var(--sidebar); }
    .app-frame { display:grid; grid-template-columns:72px minmax(0,1fr); }
    .sidebar { padding:24px 8px; border-right:1px solid var(--line); background:var(--sidebar); }
    .nav-links { display:flex; flex-direction:column; gap:6px; }
    .nav-link { min-height:52px; display:grid; place-items:center; padding:12px 10px; border-radius:8px; color:inherit; }
    .nav-link[aria-current="page"] { background:var(--amber-band); color:var(--amber-ink); }
    main { min-width:0; padding:30px 28px 42px; }
    .provenance { margin-top:8px; max-width:72ch; color:var(--muted); }
    .state-board { margin-top:28px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px; }
    .state-specimen { min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:16px; }
    .state-specimen > .button { width:100%; }
    .state-icons { display:flex; gap:12px; align-items:center; }
    .state-icons .nav-trigger { margin:0; }
    .state-specimen p { color:var(--muted); font-size:.875rem; }
    .exceptions { margin-top:36px; padding-top:28px; border-top:1px solid var(--line); }
    .exception-board { margin-top:18px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; align-items:start; }
    .exception-group { display:flex; flex-direction:column; gap:12px; min-width:0; }
    .circle-management summary { min-width:44px; min-height:44px; padding:10px 12px; font-weight:600; }
    .password-control { position:relative; }
    .password-control input { width:100%; min-height:48px; padding:10px 56px 10px 12px; border:1px solid var(--control-line); border-radius:6px; background:var(--surface); }
    .password-reveal { position:absolute; right:2px; top:2px; width:44px; height:44px; display:grid; place-items:center; padding:0; border:0; border-radius:6px; background:transparent; }
    .text-link { color:inherit; text-decoration:underline; text-underline-offset:.2em; }
    .reference-note { margin-top:32px; max-width:72ch; color:var(--muted); font-size:.91rem; }
    @media (max-width:799px) {
      .app-header { flex-wrap:wrap; gap:0; }
      .brand-group { width:100%; }
      .brand { padding:12px 16px; font-size:1.2rem; gap:12px; }
      .brand-mark { width:29px; height:29px; }
      .nav-trigger { margin:10px; }
      .utilities { width:100%; justify-content:flex-end; padding:0 12px 12px; gap:14px; }
      .account-name { display:none; }
      .app-frame { grid-template-columns:minmax(0,1fr); }
      .sidebar { display:none; }
      main { padding:24px 12px 32px; }
      h1 { font-size:1.5rem; }
      .state-board,.exception-board { grid-template-columns:minmax(0,1fr); gap:28px; }
      .state-specimen { gap:12px; }
    }
    @media (prefers-reduced-motion:reduce) { .secondary,.language-select,.theme-button,.account-summary,.circle-management summary { transition:none; } }
    @media (forced-colors:active) {
      .secondary,.language-select,.theme-button,.account-summary,.circle-management summary { border-color:ButtonText; }
      .nav-trigger { border:0; }
      :focus-visible,.state-focus { outline-color:Highlight; }
    }
  </style>
</head>
<body>
  <div id="reference"></div>
  <script>
    const parameters = new URLSearchParams(location.search);
    const french = parameters.get('locale') === 'fr';
    const dark = parameters.get('theme') === 'dark';
    document.documentElement.lang = french ? 'fr' : 'en';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const tr = (en, fr) => french ? fr : en;
    const paths = { home:'m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9', path:'m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2ZM9 3v16M15 5v16', activity:'M5 20V13M12 20V7M19 20V3', chevron:'m6 9 6 6 6-6', moon:'M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401' };
    function icon(kind) {
      const shape = kind === 'panel' ? '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/>' : kind === 'sun' ? '<circle cx="12" cy="12" r="4"/>'+['M12 2v2','M12 20v2','m4.93 4.93 1.41 1.41','m17.66 17.66 1.41 1.41','M2 12h2','M20 12h2','m6.34 17.66-1.41 1.41','m19.07 4.93-1.41 1.41'].map(d=>`<path d="${d}"/>`).join('') : kind === 'eye' ? '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>' : `<path d="${paths[kind]}"/>`;
      return `<svg class="icon ${kind==='chevron'?'account-chevron':''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" ${['panel','sun','moon','eye'].includes(kind)?'style="stroke-width:2"':''}>${shape}</svg>`;
    }
    const themeLabel = dark ? tr('Switch to light mode','Passer au mode clair') : tr('Switch to dark mode','Passer au mode sombre');
    const themeIcon = icon(dark ? 'sun' : 'moon');
    const brand = '<div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7V25H17V7H27M17 15H25"/></svg><span class="brand-name">Little<wbr>Further</span></div>';
    const sidebarButton = (state='') => `<button type="button" class="nav-trigger ${state}" aria-label="${tr('Expand navigation','Ouvrir la navigation')}">${icon('panel')}</button>`;
    const header = `<header class="app-header"><div class="brand-group">${sidebarButton()}${brand}</div><div class="utilities"><select class="language-select" aria-label="${tr('Language','Langue')}"><option>${tr('English','Français')}</option></select><button type="button" class="theme-button" aria-label="${themeLabel}">${themeIcon}</button><details><summary class="account-summary" aria-label="${tr('Account','Compte')}"><span class="avatar" aria-hidden="true">R</span><span class="account-name">Reign</span>${icon('chevron')}</summary></details></div></header>`;
    const navigation = `<aside class="sidebar"><nav class="nav-links">${[['home','My learning','Mon apprentissage'],['path','Journeys','Parcours'],['activity','Activity','Activité']].map(([kind,en,fr],index)=>`<a class="nav-link" ${index===0?'aria-current="page"':''} href="#" aria-label="${tr(en,fr)}">${icon(kind)}</a>`).join('')}</nav></aside>`;
    const states = [
      ['Resting','Au repos','',tr('Soft fill; no visible border.','Fond doux ; aucune bordure visible.')],
      ['Hover / press','Survol / pression','state-hover',tr('Border follows the logo colour. Sidebar: background only.','La bordure reprend la couleur du logo. Menu latéral : fond uniquement.')],
      ['Keyboard focus','Focus clavier','state-focus',tr('Immediate focus outline remains visible.','Le contour de focus reste immédiatement visible.')],
      ['Disabled','Désactivé','disabled',tr('No hover or press feedback.','Aucun effet au survol ni à la pression.')],
    ];
    const specimens = states.map(([en,fr,state,note])=>`<section class="state-specimen"><h2>${tr(en,fr)}</h2><button type="button" class="button secondary ${state==='disabled'?'':state}" ${state==='disabled'?'disabled':''}>${tr('Open study circles','Ouvrir les cercles d’étude')}</button><div class="state-icons">${state==='disabled'?'<button type="button" class="nav-trigger" disabled aria-label="'+tr('Expand navigation','Ouvrir la navigation')+'">'+icon('panel')+'</button>':sidebarButton(state)}<button type="button" class="theme-button ${state==='disabled'?'':state}" ${state==='disabled'?'disabled':''} aria-label="${themeLabel}">${themeIcon}</button></div><p>${note}</p></section>`).join('');
    const content = `<h1>${tr('Quieter borders, clear actions','Bordures discrètes, actions claires')}</h1><p class="provenance">${tr('Synthetic pre-implementation reference. State samples below are illustrative; no learner data or app actions.','Référence synthétique avant implémentation. Les états ci-dessous sont illustratifs ; aucune donnée ni action de l’application.')}</p><div class="state-board">${specimens}</div><section class="exceptions"><h2>${tr('Preserved controls and scoped disclosure','Commandes conservées et déploiement ciblé')}</h2><div class="exception-board"><section class="exception-group"><h3>${tr('Primary and learning path','Action principale et parcours')}</h3><button type="button" class="button primary">${tr('Start studying','Commencer à étudier')}</button><button type="button" class="path-action">${tr('Review the page','Relire la page')}</button><a href="#" class="text-link">${tr('Back to my learning','Retour à mon apprentissage')}</a></section><section class="exception-group"><h3>${tr('Secondary and circle settings','Actions secondaires et cercle')}</h3><button type="button" id="test-subject" class="button secondary">${tr('Edit plan','Modifier le programme')}</button><details class="circle-management"><summary>${tr('Circle settings','Paramètres du cercle')}</summary></details></section><section class="exception-group"><h3>${tr('Password field','Champ de mot de passe')}</h3><label for="password">${tr('Password','Mot de passe')}</label><div class="password-control"><input id="password" type="password" value="synthetic-example" readonly autocomplete="off"><button type="button" class="password-reveal" aria-label="${tr('Show password','Afficher le mot de passe')}">${icon('eye')}</button></div></section></div></section><p class="reference-note">${tr('150ms border-colour fade, no size change. Light: ink. Dark: Amber. Reduced motion removes the fade; forced colours restores system boundaries. The original A monogram, system font and existing primary/path/field treatments are preserved.','Fondu de la bordure sur 150 ms, sans changement de taille. Clair : encre. Sombre : ambre. Mouvement réduit : sans fondu. Couleurs forcées : bordures système. Le monogramme A original, la police système et les actions principales, le parcours et les champs sont conservés.')}</p>`;
    document.getElementById('reference').innerHTML = header + `<div class="app-frame">${navigation}<main>${content}</main></div>`;
  </script>
</body>
</html>

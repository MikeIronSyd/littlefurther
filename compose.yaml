name: littlefurther
services:
  app:
    build:
      context: .
      target: runtime
    environment:
      CAPSTONE_BIND_HOST: 0.0.0.0
      CAPSTONE_PORT: ${CAPSTONE_PORT:-4317}
      CAPSTONE_DATA_DIR: /app/.local/data
    ports:
      - "127.0.0.1:${CAPSTONE_PORT:-4317}:${CAPSTONE_PORT:-4317}"
    volumes:
      - learning-data:/app/.local/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.CAPSTONE_PORT||'4317')+'/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 15s
volumes:
  learning-data:
